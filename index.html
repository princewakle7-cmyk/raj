<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anna Construction - Neon Pro</title>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB2sKZhBlgz19Ft0AVwB7mSUDMNSl4S5Ug",
            authDomain: "manager-ac062.firebaseapp.com",
            projectId: "manager-ac062",
            storageBucket: "manager-ac062.firebasestorage.app",
            messagingSenderId: "646058534721",
            appId: "1:646058534721:web:2d17c9e83f529bde4523c0"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        window.db = db; window.doc = doc; window.setDoc = setDoc; window.getDoc = getDoc;
    </script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --neon-blue: #00f2ff; --neon-green: #39ff14; --neon-red: #ff3131; --dark-bg: #0a0a0c; --card-bg: #16161a; }
        
        body { 
            font-family: 'Segoe UI', sans-serif; 
            margin: 0; padding-bottom: 90px;
            background-color: var(--dark-bg);
            color: #ffffff;
            overflow-x: hidden;
        }

        /* Floating Tiranga */
        .tiranga { position: fixed; top: 15px; left: 15px; z-index: 2000; font-size: 28px; filter: drop-shadow(0 0 5px #fff); }

        .header { 
            background: rgba(22, 22, 26, 0.95); 
            padding: 20px; text-align: center; 
            border-bottom: 2px solid var(--neon-blue);
            box-shadow: 0 0 15px var(--neon-blue);
        }
        .header h1 { margin: 0; font-size: 22px; color: var(--neon-blue); text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 10px var(--neon-blue); }

        .container { padding: 15px; max-width: 700px; margin: auto; }
        
        /* Neon Animated Cards */
        .card { 
            background: var(--card-bg); 
            padding: 20px; border-radius: 15px; 
            margin-bottom: 20px; 
            border: 1px solid rgba(0, 242, 255, 0.3);
            box-shadow: 0 0 10px rgba(0, 242, 255, 0.1);
            transition: 0.4s;
            animation: slideUp 0.5s ease-out;
        }
        .card:hover { border-color: var(--neon-blue); box-shadow: 0 0 20px var(--neon-blue); transform: translateY(-5px); }

        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        h3 { color: var(--neon-blue); font-size: 16px; margin-top: 0; display: flex; align-items: center; gap: 10px; }

        input, select { 
            width: 100%; padding: 14px; margin: 10px 0; 
            border-radius: 10px; border: 1px solid #333; 
            background: #222; color: #fff; font-size: 14px;
            outline: none; transition: 0.3s;
        }
        input:focus { border-color: var(--neon-blue); box-shadow: 0 0 10px var(--neon-blue); }

        /* Neon Buttons */
        button { 
            border: none; border-radius: 10px; cursor: pointer; 
            font-weight: bold; padding: 14px; width: 100%; 
            transition: 0.3s; text-transform: uppercase;
        }
        .btn-main { background: none; border: 2px solid var(--neon-blue); color: var(--neon-blue); }
        .btn-main:hover { background: var(--neon-blue); color: #000; box-shadow: 0 0 20px var(--neon-blue); }
        
        .btn-success { background: none; border: 2px solid var(--neon-green); color: var(--neon-green); }
        .btn-success:hover { background: var(--neon-green); color: #000; box-shadow: 0 0 20px var(--neon-green); }

        .btn-danger { border: 1px solid var(--neon-red); color: var(--neon-red); background: none; width: auto; padding: 5px 10px; font-size: 12px; }

        /* Nav Bar */
        .nav-bar { position: fixed; bottom: 0; width: 100%; background: #111; display: flex; justify-content: space-around; padding: 15px 0; border-top: 1px solid var(--neon-blue); z-index: 1000; }
        .nav-item { border: none; background: none; color: #888; display: flex; flex-direction: column; align-items: center; cursor: pointer; transition: 0.3s; }
        .nav-item.active { color: var(--neon-blue); text-shadow: 0 0 10px var(--neon-blue); }
        .nav-item i { font-size: 20px; }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        td, th { padding: 12px 8px; text-align: left; border-bottom: 1px solid #222; font-size: 14px; }
        th { color: var(--neon-blue); }
    </style>
</head>
<body>

<div class="tiranga">🇮🇳</div>
<div class="header">
    <h1>ANNA CONSTRUCTION</h1>
</div>

<div class="container">
    <div id="tab-home" class="tab-content active">
        <div class="card">
            <h3><i class="fas fa-money-bill-wave"></i> Pending Dues</h3>
            <div id="duesBody"></div>
        </div>
    </div>

    <div id="tab-log" class="tab-content">
        <div class="card">
            <h3><i class="fas fa-plus-circle"></i> Daily Work Log</h3>
            <input type="date" id="attDate">
            <select id="attSite"><option value="">-- Select Site --</option></select>
            <select id="attLabour"><option value="">-- Select Labour --</option></select>
            <input type="number" id="ownerRate" placeholder="Owner Billing Rate (₹)">
            <button class="btn-success" onclick="addAttendance()">Save To Cloud</button>
        </div>
        <div class="card">
            <h3><i class="fas fa-history"></i> Recent Logs</h3>
            <div id="logBody"></div>
        </div>
    </div>

    <div id="tab-reg" class="tab-content">
        <div class="card">
            <h3><i class="fas fa-user-plus"></i> New Registration</h3>
            <input type="text" id="labourName" placeholder="Labour Name">
            <input type="number" id="labourWage" placeholder="Fix Daily Wage (₹)">
            <button class="btn-main" onclick="addLabour()">Register Labour</button>
            <hr style="border: 0.1px solid #333; margin: 20px 0;">
            <input type="text" id="siteName" placeholder="Site Name">
            <button class="btn-main" onclick="addSite()">Register Site</button>
        </div>
        <div class="card">
            <h3><i class="fas fa-cogs"></i> Manage List</h3>
            <div id="masterBody"></div>
        </div>
    </div>

    <div id="tab-reports" class="tab-content">
        <div class="card">
            <h3><i class="fas fa-print"></i> Generate Bill</h3>
            <select id="reportSite"><option value="">-- Select Site --</option></select>
            <button class="btn-main" style="border-color: var(--neon-green); color: var(--neon-green);" onclick="exportPDF()">Download PDF Bill</button>
        </div>
    </div>
</div>

<div class="nav-bar">
    <button class="nav-item active" onclick="openTab('home', this)"><i class="fas fa-home"></i> Home</button>
    <button class="nav-item" onclick="openTab('log', this)"><i class="fas fa-calendar-alt"></i> Entry</button>
    <button class="nav-item" onclick="openTab('reg', this)"><i class="fas fa-tools"></i> Master</button>
    <button class="nav-item" onclick="openTab('reports', this)"><i class="fas fa-file-pdf"></i> Report</button>
</div>

<script>
    let appData = { sites: [], labours: [], attendance: [] };

    async function loadData() {
        try {
            const snap = await window.getDoc(window.doc(window.db, "users", "deepak_shengule"));
            if (snap.exists()) { appData = snap.data(); renderUI(); }
        } catch(e) { console.error("Load Error", e); }
    }

    async function sync() {
        await window.setDoc(window.doc(window.db, "users", "deepak_shengule"), appData);
        alert("✔️ Data Saved Successfully!");
        renderUI();
    }

    function addAttendance() {
        let date = document.getElementById('attDate').value;
        let sid = document.getElementById('attSite').value;
        let lid = document.getElementById('attLabour').value;
        let rate = parseFloat(document.getElementById('ownerRate').value);

        if(!sid || !lid || isNaN(rate)) return alert("❌ Fill Site, Labour and Rate!");

        let duplicate = appData.attendance.find(a => a.date === date && a.labourId === lid);
        if(duplicate) return alert("❌ Already marked for today!");

        let labour = appData.labours.find(l => l.id == lid);
        appData.attendance.push({ id: Date.now(), date, siteId: sid, labourId: lid, ownerRate: rate, labourRate: labour.wage, paid: false });
        sync();
    }

    function renderUI() {
        let sOpt = '<option value="">-- Select Site --</option>' + appData.sites.map(s=>`<option value="${s.id}">${s.name}</option>`).join("");
        document.getElementById('attSite').innerHTML = sOpt;
        document.getElementById('reportSite').innerHTML = sOpt;
        let lOpt = '<option value="">-- Select Labour --</option>' + appData.labours.map(l=>`<option value="${l.id}">${l.name}</option>`).join("");
        document.getElementById('attLabour').innerHTML = lOpt;

        let duesHtml = "<table><thead><tr><th>Labour</th><th>Due</th><th>Action</th></tr></thead><tbody>";
        appData.labours.forEach(l => {
            let due = appData.attendance.filter(a => a.labourId == l.id && !a.paid).reduce((s, a) => s + a.labourRate, 0);
            if(due > 0) duesHtml += `<tr><td>${l.name}</td><td>₹${due}</td><td><button class="btn-success" onclick="payLabour(${l.id})" style="padding:5px 10px; width:auto;">Paid</button></td></tr>`;
        });
        document.getElementById('duesBody').innerHTML = duesHtml + "</tbody></table>";

        let logHtml = "<table><tbody>";
        appData.attendance.slice().reverse().slice(0, 5).forEach(a => {
            let l = appData.labours.find(lab => lab.id == a.labourId);
            logHtml += `<tr><td>${a.date}</td><td>${l?.name}</td><td><button class="btn-danger" onclick="deleteLog(${a.id})">X</button></td></tr>`;
        });
        document.getElementById('logBody').innerHTML = logHtml + "</tbody></table>";

        let mHtml = "<table><tbody>";
        appData.labours.forEach(l => mHtml += `<tr><td>👷 ${l.name}</td><td><button class="btn-danger" onclick="delMaster('labour', ${l.id})">Delete</button></td></tr>`);
        appData.sites.forEach(s => mHtml += `<tr><td>📍 ${s.name}</td><td><button class="btn-danger" onclick="delMaster('site', ${s.id})">Delete</button></td></tr>`);
        document.getElementById('masterBody').innerHTML = mHtml + "</tbody></table>";
    }

    function exportPDF() {
        try {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            let sid = document.getElementById('reportSite').value;
            let site = appData.sites.find(s => s.id == sid);
            if(!site) return alert("❌ Please select a Site first!");

            doc.setTextColor(30, 58, 138);
            doc.setFontSize(24);
            doc.text("ANNA CONSTRUCTION", 105, 20, { align: "center" });
            doc.setFontSize(10);
            doc.text("Civil Contractor | Parbhani | Mo. 9XXXX XXXXX", 105, 26, { align: "center" });
            doc.line(15, 30, 195, 30);

            doc.setTextColor(0);
            doc.setFontSize(14);
            doc.text("BILL FOR SITE: " + site.name.toUpperCase(), 15, 42);

            let filtered = appData.attendance.filter(a => a.siteId == sid);
            let tableData = filtered.map((a, i) => [i + 1, a.date, appData.labours.find(l=>l.id==a.labourId)?.name, "Rs. " + a.ownerRate]);

            doc.autoTable({
                startY: 50,
                head: [['Sr.No', 'Date', 'Description', 'Amount']],
                body: tableData,
                theme: 'grid',
                headStyles: { fillColor: [30, 58, 138] },
                foot: [['', '', 'TOTAL RECEIVABLE:', "Rs. " + filtered.reduce((s,a)=>s+a.ownerRate,0)]],
                footStyles: { fillColor: [240, 240, 240], fontStyle: 'bold' }
            });

            doc.save(`Bill_${site.name}.pdf`);
        } catch(e) { console.error(e); alert("Error generating PDF!"); }
    }

    function openTab(id, el) {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.getElementById('tab-' + id).classList.add('active');
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        el.classList.add('active');
    }

    function payLabour(lid) { if(confirm("Clear Payment?")) { appData.attendance.forEach(a => { if(a.labourId == lid) a.paid = true; }); sync(); } }
    function delMaster(type, id) { if(confirm("Delete Permanently?")) { if(type === 'labour') appData.labours = appData.labours.filter(l => l.id != id); else appData.sites = appData.sites.filter(s => s.id != id); sync(); } }
    function deleteLog(id) { if(confirm("Delete Log?")) { appData.attendance = appData.attendance.filter(a => a.id != id); sync(); } }
    function addLabour() { let n = document.getElementById('labourName').value; let w = document.getElementById('labourWage').value; if(n && w) { appData.labours.push({id: Date.now(), name: n, wage: parseFloat(w)}); sync(); } }
    function addSite() { let n = document.getElementById('siteName').value; if(n) { appData.sites.push({id: Date.now(), name: n}); sync(); } }

    document.getElementById('attDate').valueAsDate = new Date();
    setTimeout(loadData, 2000);
</script>
</body>
</html>
